apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      initContainers:
        - name: database-schema
          image: mcr.microsoft.com/mssql-tools
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              SQLCMD=/opt/mssql-tools18/bin/sqlcmd
              if [ ! -x "$SQLCMD" ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi
              until "$SQLCMD" -S sqlserver,1433 -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"; do sleep 3; done
              "$SQLCMD" -S sqlserver,1433 -U sa -P "$MSSQL_SA_PASSWORD" -C -b -i /scripts/000-create-databases.sql
              "$SQLCMD" -S sqlserver,1433 -U sa -P "$MSSQL_SA_PASSWORD" -C -b -i /scripts/010-users-schema.sql
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secrets
                  key: MSSQL_SA_PASSWORD
          volumeMounts:
            - name: database-scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: users-api
          image: ghcr.io/posgraduacaofiapnet/fcg-users-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: users-api-config
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: users-api-secrets
                  key: UsersConnectionString
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: users-api-secrets
                  key: Jwt__Key
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: database-scripts
          configMap:
            name: fcg-database-schema
